<script>
const qs = new URLSearchParams(location.search);
const MATCH_ID = qs.get('id') || location.pathname.split('/').pop();

function getSession(){ return localStorage.getItem('session_token') || (document.cookie.match(/(?:^| )session_token=([^;]+)/)?.[1] ?? ""); }
async function api(path){
  const r = await fetch(path, { headers: { Authorization: 'Session '+getSession() } });
  if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}

// Maps : index par URL & UUID
async function fetchMapsIndex(){
  const r = await fetch('https://valorant-api.com/v1/maps?language=fr-FR');
  const { data=[] } = await r.json();
  const byUrl = {}, byUuid = {};
  for(const m of data){
   // fetchMapsIndex()
const info = {
  uuid: m.uuid,
  name: m.displayName,
  url: (m.mapUrl||'').toLowerCase(),
  displayIcon: m.displayIcon || null,
    splash: m.splash || null,

  callouts: m.callouts,
  xMultiplier: Number(m.xMultiplier ?? NaN),
  yMultiplier: Number(m.yMultiplier ?? NaN),
  xScalarToAdd: Number(m.xScalarToAdd ?? NaN),
  yScalarToAdd: Number(m.yScalarToAdd ?? NaN),
};

    if(info.url)  byUrl[info.url]=info;
    if(info.uuid) byUuid[info.uuid]=info;
  }
  return { byUrl, byUuid };
}

const MODE_LABEL = {
  competitive:'Compétitif', unrated:'Non classé', spikerush:'Spike Rush',
  swiftplay:'Swiftplay', ggteam:'Escalation', hurm:'Match à mort',
  replication:'Replication', deathmatch:'Match à mort', custom:'Personnalisé'
};
const niceMode = raw => (raw? (MODE_LABEL[raw.toLowerCase().split('/').pop()] || raw) : '—');

function aggregate(match){
  const players = {};
  (match.players||[]).forEach(p=>{
    players[p.subject] = {
      id:p.subject, name:p.gameName||p.subject.slice(0,8),
      team:p.teamId||p.team||'Blue', k:0,d:0,a:0,
      agentID: p.characterId
    };
  });
  const pts=[]; let scoreA=0, scoreB=0;
  for(const r of (match.roundResults||[])){
    const w=(r.winningTeam||'').toLowerCase();
    if(w.includes('blue')) scoreA++; else if(w.includes('red')) scoreB++;
    for(const ps of (r.playerStats||[])){
      const killer=ps.subject;
      for(const k of (ps.kills||[])){
        if(players[killer]) players[killer].k++;
        if(players[k.victim]) players[k.victim].d=(players[k.victim].d||0)+1;
        (k.assistants||[]).forEach(a=>{ if(players[a]) players[a].a++; });
        if(k.victimLocation) pts.push({x:k.victimLocation.x,y:k.victimLocation.y,team:players[killer]?.team||'Blue'});
      }
    }
  }
  return {players, scoreA, scoreB, pts};
}

function computeBounds(mapInfo, pts){
  const xs=[], ys=[];
  (mapInfo.callouts||[]).forEach(c=>{ if(c.location){ xs.push(c.location.x); ys.push(c.location.y); }});
  pts.forEach(p=>{ xs.push(p.x); ys.push(p.y); });
  if(!xs.length||!ys.length) return {minX:0,maxX:1,minY:0,maxY:1};
  return {minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)};
}
function adjustBoundsToAspect(b,w,h){
  const ar=w/h, bar=(b.maxX-b.minX)/(b.maxY-b.minY);
  if(Math.abs(bar-ar)<1e-3) return b;
  if(bar>ar){ const bh2=(b.maxX-b.minX)/ar, d=(bh2-(b.maxY-b.minY))/2; return {...b,minY:b.minY-d,maxY:b.maxY+d}; }
  const bw2=(b.maxY-b.minY)*ar, d=(bw2-(b.maxX-b.minX))/2; return {...b,minX:b.minX-d,maxX:b.maxX+d};
}
function projectPoint(p, mapInfo, canvas, pts){
  const hasTransform = [mapInfo.xMultiplier, mapInfo.yMultiplier, mapInfo.xScalarToAdd, mapInfo.yScalarToAdd]
    .every(v => typeof v === "number" && !isNaN(v));

  if (hasTransform){
    return {
      x: (p.x * mapInfo.xMultiplier + mapInfo.xScalarToAdd) * canvas.width,
      y: (1 - (p.y * mapInfo.yMultiplier + mapInfo.yScalarToAdd)) * canvas.height
    };
  } else {
    // fallback avec bounding box des kills
    const xs = pts.map(k => k.x);
    const ys = pts.map(k => k.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    return {
      x: ((p.x - minX) / (maxX - minX)) * canvas.width,
      y: canvas.height - ((p.y - minY) / (maxY - minY)) * canvas.height
    };
  }
}
function projectKillToPx(kill, mapInfo, W, H, origin="topleft") {
  // 1) jeu -> normalisé
  const u = kill.x * mapInfo.xMultiplier + mapInfo.xScalarToAdd;
  const v = kill.y * mapInfo.yMultiplier + mapInfo.yScalarToAdd;

  // 2) normalisé -> pixels (repère haut-gauche avec Y inversé)
  let px = u * W;
  let py = (1 - v) * H; // si besoin, teste aussi: let py = v * H;

  // 3) changer d’origine si demandé
  if (origin === "bottomright") {
    px = W - px;
    py = H - py;
  } else if (origin === "center") {
    px = px - W/2;
    py = py - H/2;
    // pour dessiner sur canvas, retranslate ensuite: px += W/2; py += H/2;
  }
  return { px, py };
}

function drawKills(mapInfo, kills) {
  const img = document.getElementById("mapImg");
  const canvas = document.getElementById("killCanvas");
  const ctx = canvas.getContext("2d");

  img.onload = () => {
    const W = canvas.width  = img.clientWidth;
    const H = canvas.height = img.clientHeight;
    ctx.clearRect(0,0,W,H);

    for (const k of kills) {
      const { px, py } = projectKillToPx(k, mapInfo, W, H, "bottomright"); // ← origine bas-droit
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI*2);
      ctx.fillStyle = (k.team?.toLowerCase().includes('blue')) ? '#60a5fa' : '#f87171';
      ctx.fill();
    }
  };
  img.src = mapInfo.displayIcon + (mapInfo.displayIcon.includes('?')?'&':'?') + 't=' + Date.now();
}



async function fetchAgentsIndex(){
  const r = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true&language=fr-FR');
  const { data=[] } = await r.json();
  const byId = {};
  for(const a of data){
    byId[a.uuid] = {
      name: a.displayName,
      icon: a.displayIconSmall || a.displayIcon || a.bustPortrait || a.fullPortraitV2 || a.fullPortrait || null,
      portrait: a.fullPortraitV2 || a.fullPortrait || a.displayIcon || null
    };
  }
  return byId;
}

function computePerPlayerStats(match){
  const rounds = (match.roundResults||[]).length || 1;
  const stats = {};
  (match.players||[]).forEach(p=>{
    stats[p.subject] = {
      id: p.subject,
      name: p.gameName || p.subject.slice(0,8),
      tag:  p.tagLine || "",
      team: (p.teamId || p.team || 'Blue').toLowerCase(),
      agentId: p.characterId || null,
      k:0,d:0,a:0, score:0, dmg:0, hs:0, shots:0
    };
  });
  for(const r of (match.roundResults||[])){
    for(const ps of (r.playerStats||[])){
      const s = stats[ps.subject]; if(!s) continue;
      s.score += (ps.score||0);
      for(const d of (ps.damage||[])){
        s.dmg += (d.damage||0);
        s.hs  += (d.headshots||0);
        s.shots += ((d.headshots||0)+(d.bodyshots||0)+(d.legshots||0));
      }
      for(const k of (ps.kills||[])){
        s.k += 1;
        if (stats[k.victim]) stats[k.victim].d += 1;
        (k.assistants||[]).forEach(aid=>{ if(stats[aid]) stats[aid].a += 1; });
      }
    }
  }
  // dérivés
  for(const s of Object.values(stats)){
    s.kd  = s.d ? (s.k/s.d) : (s.k>0 ? s.k : 0);
    s.acs = Math.round(s.score/rounds);
    s.adr = Math.round(s.dmg/rounds);
    s.hsP = s.shots ? Math.round((s.hs/s.shots)*1000)/10 : 0; // ex: 4.3
  }
  return stats;
}

function renderMatchHeader(match){
  (async ()=>{
    const agents = await fetchAgentsIndex();
    const S = computePerPlayerStats(match);
    const list = Object.values(S);
    const A = list.filter(x=>x.team.includes('blue'));
    const B = list.filter(x=>x.team.includes('red'));

    // Teams strip
    const el = document.getElementById('teamsStrip');
    const pill = (txt, cls) => `<span class="text-sm ${cls} font-semibold px-2">${txt}</span>`;
    const avatar = p => {
      const a = agents[p.agentId]||{};
      const src = a.icon || '';
      return `<button class="shrink-0 -mb-1 group" data-pid="${p.id}" title="${p.name}">
        <img src="${src}" class="h-10 w-10 rounded-xl border border-white/10 bg-zinc-900 object-cover group-hover:scale-105 transition" />
      </button>`;
    };
    el.innerHTML = [
      pill('Team A','text-emerald-300'),
      ...A.map(avatar),
      `<span class="px-3 text-zinc-400">VS</span>`,
      ...B.map(avatar),
      pill('Team B','text-rose-300')
    ].join('');

    // Player focus (par défaut: meilleur ACS côté A sinon B)
    const pick = (arr)=> arr.slice().sort((x,y)=>y.acs-x.acs)[0] || arr[0];
    let current = pick(A) || pick(B);

    function drawFocus(p){
      const a = agents[p.agentId]||{};
      const name = p.name + (p.tag?` <span class="text-zinc-400">#${p.tag}</span>`:'');
      document.getElementById('playerFocus').innerHTML = `
        <div class="grid grid-cols-[120px_1fr_auto] items-center gap-4">
          <img src="${a.portrait||a.icon||''}" class="h-28 w-28 object-contain rounded-xl bg-white/5" alt="">
          <div class="space-y-1">
            <div class="text-2xl font-extrabold">${name}</div>
            <div class="grid grid-cols-5 gap-4 text-sm">
              <div><div class="text-zinc-400">K/D/A</div><div class="text-xl font-semibold">${p.k} / ${p.d} / ${p.a}</div></div>
              <div><div class="text-zinc-400">K/D</div><div class="text-xl font-semibold">${p.kd.toFixed(2)}</div></div>
              <div><div class="text-zinc-400">ADR</div><div class="text-xl font-semibold">${p.adr}</div></div>
              <div><div class="text-zinc-400">ACS</div><div class="text-xl font-semibold">${p.acs}</div></div>
              <div><div class="text-zinc-400">HS%</div><div class="text-xl font-semibold">${p.hsP}%</div></div>
            </div>
          </div>
          <a class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 border border-white/10 text-sm" href="/profile?puuid=${encodeURIComponent(p.id)}">View Profile</a>
        </div>`;
    }
    drawFocus(current);

    // clicks
    el.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-pid]');
      if(!btn) return;
      const pid = btn.getAttribute('data-pid');
      current = S[pid];
      drawFocus(current);
    });
  })().catch(console.error);
}


// Utilise ton fetchAgentsIndex() existant
const badge = (v, ok=true) =>
  `<span class="px-2 py-0.5 rounded-md text-[12px] font-semibold ${ok?'bg-emerald-600/20 text-emerald-300':'bg-rose-600/20 text-rose-300'}">${v}</span>`;

function splitTeams(match){
  const P = {};
  (match.players||[]).forEach(p=>{
    P[p.subject]={ id:p.subject, name:p.gameName||p.subject.slice(0,8),
      tag:p.tagLine||'', team:(p.teamId||p.team||'Blue').toLowerCase(),
      agentId:p.characterId||null };
  });
  const A=[], B=[];
  Object.values(P).forEach(x => (x.team.includes('blue')?A:B).push(x));
  return {A,B,byId:P};
}

function computeMatrix(match){
  const {A,B,byId} = splitTeams(match);
  // matrix[Aid][Bid] = {a2b, b2a}
  const M = {}; A.forEach(a=>{ M[a.id]={}; B.forEach(b=> M[a.id][b.id]={a2b:0,b2a:0}); });

  for(const r of (match.roundResults||[])){
    for(const ps of (r.playerStats||[])){
      const killer = byId[ps.subject]; if(!killer) continue;
      for(const k of (ps.kills||[])){
        const vic = byId[k.victim]; if(!vic) continue;
        const aIsA = killer.team.includes('blue'), vIsB = vic.team.includes('red');
        const aIsB = killer.team.includes('red'), vIsA = vic.team.includes('blue');
        if(aIsA && vIsB) M[killer.id]?.[vic.id] && (M[killer.id][vic.id].a2b++);
        else if(aIsB && vIsA) M[vic.id]?.[killer.id] && (M[vic.id][killer.id].b2a++);
      }
    }
  }
  return {A,B,M};
}

function bestPairs(A,B,M){
  let top={a:null,b:null,score:-1}, misA={a:null,b:null,delta:-1}, misB={a:null,b:null,delta:-1};
  for(const a of A) for(const b of B){
    const c = M[a.id][b.id];
    const minboth = Math.min(c.a2b,c.b2a);
    if(minboth>top.score) top={a,b,score:minboth};

    const dAB = c.a2b - c.b2a;
    if(dAB>misA.delta) misA={a,b,delta:dAB};
    const dBA = c.b2a - c.a2b;
    if(dBA>misB.delta) misB={a,b,delta:dBA};
  }
  return {top,misA,misB};
}

/**
 * Transforme le chemin gameMode brut en assetPath comparable à l'API
 * @param {string} rawMode - ex: "/Game/GameModes/Bomb/BombGameMode.BombGameMode_C"
 * @returns {string} - ex: "ShooterGame/Content/GameModes/Bomb/BombGameMode_PrimaryAsset"
 */
function normalizeGameMode(rawMode) {
  if (!rawMode) return "";
  let out = rawMode;

  // remplacer le prefix Unreal
  out = out.replace(/^\/Game\//, "ShooterGame/Content/");

  // nettoyer le suffixe .XXX_C -> _PrimaryAsset
  out = out.replace(/\.[^/]+_C$/, "_PrimaryAsset");

  return out;
}

/**
 * Résout un gameMode brut en objet API complet
 * @param {string} rawMode - ex: "/Game/GameModes/Bomb/BombGameMode.BombGameMode_C"
 * @param {Array} gameModes - liste des gameModes depuis l'API valorant
 * @returns {object} - objet API du gameMode ou un fallback
 */
function resolveGameMode(rawMode, gameModes) {
  const normalized = normalizeGameMode(rawMode);
  const gm = gameModes.find(g => g.assetPath === normalized);

  if (gm) return gm;

  // fallback si non trouvé
  return {
    displayName: "Unknown",
    description: "Mode non reconnu",
    displayIcon: null,
    assetPath: normalized
  };
}

/* ---- Math ---- */
function worldToImg(wx,wy,t){ return {X:t[0]*wx+t[1]*wy+t[2], Y:t[3]*wx+t[4]*wy+t[5]}; }
function rmsError(P,t){let s=0;P.forEach(p=>{const q=worldToImg(p.wx,p.wy,t);s+=(q.X-p.X)**2+(q.Y-p.Y)**2});return Math.sqrt(s/P.length);}
function solveAffineLS(P){
  const N=P.length,m=2*N,n=6;
  const A=Array.from({length:m},()=>Array(n).fill(0)),b=Array(m).fill(0);
  P.forEach((p,i)=>{A[2*i]=[p.wx,p.wy,1,0,0,0];b[2*i]=p.X;A[2*i+1]=[0,0,0,p.wx,p.wy,1];b[2*i+1]=p.Y;});
  const AtA=matMul(matTrans(A),A),Atb=matVec(matTrans(A),b);
  return gaussSolve(AtA,Atb);
}
function matTrans(M){const r=M.length,c=M[0].length;const T=Array.from({length:c},()=>Array(r));
  for(let i=0;i<r;i++)for(let j=0;j<c;j++)T[j][i]=M[i][j];return T;}
function matMul(A,B){const r=A.length,c=B[0].length,k=A[0].length;const R=Array.from({length:r},()=>Array(c).fill(0));
  for(let i=0;i<r;i++)for(let j=0;j<c;j++){let s=0;for(let t=0;t<k;t++)s+=A[i][t]*B[t][j];R[i][j]=s;}return R;}
function matVec(A,v){const r=A.length,c=A[0].length;const out=Array(r).fill(0);
  for(let i=0;i<r;i++){let s=0;for(let j=0;j<c;j++)s+=A[i][j]*v[j];out[i]=s;}return out;}
function gaussSolve(A,b){const n=b.length;const M=A.map(r=>r.slice());const x=b.slice();
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;
    [M[i],M[p]]=[M[p],M[i]];[x[i],x[p]]=[x[p],x[i]];const diag=M[i][i]||1e-12;
    for(let j=i;j<n;j++)M[i][j]/=diag;x[i]/=diag;
    for(let r=0;r<n;r++)if(r!==i){const f=M[r][i];for(let j=i;j<n;j++)M[r][j]-=f*M[i][j];x[r]-=f*x[i];}}
  return x;
}
