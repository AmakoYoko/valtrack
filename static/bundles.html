<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALTrack — Bundles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{ font-family: Inter, ui-sans-serif, system-ui; }
    .glass{ backdrop-filter: blur(8px); background: rgba(255,255,255,0.06); }
    .shimmer{ position:relative; overflow:hidden; }
    .shimmer::after{ content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); animation:shimmer 1.3s infinite; }
    @keyframes shimmer{100%{transform:translateX(100%);}}
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/80 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-grid place-items-center h-9 w-9 rounded-xl bg-white/10">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
          </svg>
        </span>
        <span class="font-extrabold tracking-tight">VALTrack</span>
      </a>
      <a href="/dashboard" class="text-sm text-zinc-300 hover:text-white">← Dashboard</a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    <!-- Search / Controls -->
    <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
      <h1 class="text-2xl font-bold">Bundles</h1>
      <div class="flex items-center gap-2">
        <input id="search" type="text" placeholder="Rechercher un bundle…" class="w-72 max-w-full rounded-xl bg-zinc-900/70 border border-white/10 px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-400"/>
        <select id="pageSize" class="rounded-xl bg-zinc-900/70 border border-white/10 px-3 py-2 text-sm">
          <option value="8">8 / page</option>
          <option value="12" selected>12 / page</option>
          <option value="16">16 / page</option>
          <option value="24">24 / page</option>
        </select>
      </div>
    </section>

    <!-- Grid -->
    <section>
      <div id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- cards -->
      </div>

      <!-- Pagination -->
      <div class="mt-8 flex items-center justify-between">
        <p class="text-sm text-zinc-400">Page <span id="curPage">1</span> / <span id="maxPage">1</span> — <span id="total">0</span> résultats</p>
        <div class="flex items-center gap-2">
          <button id="prevBtn" class="px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5 disabled:opacity-40" disabled>Précédent</button>
          <button id="nextBtn" class="px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5 disabled:opacity-40" disabled>Suivant</button>
        </div>
      </div>
    </section>
  </main>

  <template id="cardTpl">
    <article class="rounded-2xl border border-white/10 glass overflow-hidden flex flex-col">
      <div class="relative">
        <div class="aspect-[4/3] bg-white/5 grid place-items-center overflow-hidden">
          <img class="bundle-img h-full w-full object-contain hidden" alt="Bundle"/>
          <div class="skeleton h-full w-full shimmer"></div>
        </div>
        <!-- barre basse colorée (déco) -->
        <div class="bar h-1.5 w-full"></div>
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <h3 class="name font-semibold">Bundle</h3>
        <p class="desc text-xs text-zinc-400 mt-1 line-clamp-2">—</p>
        <div class="mt-4 flex gap-2">
          <a class="detail inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5" target="_blank" rel="noopener">Détails</a>
        </div>
      </div>
    </article>
  </template>

  <script>
    // ===== State =====
    const state = { all: [], items: [], page: 1, pageSize: 12, q: '' };

    // Couleurs de barre (générées depuis le nom pour variété)
    function barColorFromName(name=''){
      let h=0; for(const c of name) h = (h*31 + c.charCodeAt(0)) % 360;
      return `hsl(${h} 70% 55%)`;
    }

    // ===== Fetch & cache =====
    async function fetchBundles(){
      const key='vt_bundles_v1'; const now=Date.now();
      try{ const raw=localStorage.getItem(key); if(raw){ const o=JSON.parse(raw); if(now-(o.ts||0)<86400000) return o.data; } }catch(_){ }
      const r = await fetch('https://valorant-api.com/v1/bundles');
      if(!r.ok) throw new Error('bundles fetch failed');
      const { data = [] } = await r.json();
      try{ localStorage.setItem(key, JSON.stringify({ts:now, data})); }catch(_){ }
      return data;
    }

    // ===== Utils =====
    const normalize = s => (s||'').toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
    const paginate = (arr,p,ps)=>{ const i=(p-1)*ps; return arr.slice(i,i+ps); };

    function imgForBundle(b){
      return b.displayIcon2 || b.displayIcon || b.verticalPromoImage || '';
    }

    // ===== Rendering =====
    function render(){
      const grid = document.getElementById('grid');
      const cur = document.getElementById('curPage');
      const max = document.getElementById('maxPage');
      const total = document.getElementById('total');
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');

      const pages = Math.max(1, Math.ceil(state.items.length / state.pageSize));
      if(state.page>pages) state.page = pages;
      const pageItems = paginate(state.items, state.page, state.pageSize);

      grid.innerHTML = '';
      const tpl = document.getElementById('cardTpl');
      pageItems.forEach(b=>{
        const node = tpl.content.cloneNode(true);
        const img = node.querySelector('.bundle-img');
        const skel = node.querySelector('.skeleton');
        const name = node.querySelector('.name');
        const desc = node.querySelector('.desc');
        const bar  = node.querySelector('.bar');
        const btn  = node.querySelector('.detail');

        const urlImg = imgForBundle(b);
        if(urlImg){ img.src=urlImg; img.classList.remove('hidden'); skel.classList.add('hidden'); }
        name.textContent = b.displayName || 'Bundle';
        desc.textContent = b.description || b.promoDescription || b.extraDescription || '';
        bar.style.background = barColorFromName(b.displayName||'');

        // lien détail (vers ta page bundle; adapte si besoin)
        btn.href = `/bundle?uuid=${encodeURIComponent(b.uuid)}`;

        grid.appendChild(node);
      });

      cur.textContent = String(state.page);
      max.textContent = String(pages);
      total.textContent = String(state.items.length);
      prev.disabled = state.page<=1;
      next.disabled = state.page>=pages;
    }

    function applyFilter(){
      const q = normalize(state.q);
      if(!q){ state.items = state.all.slice(); }
      else{
        state.items = state.all.filter(b => normalize(b.displayName).includes(q) || normalize(b.description).includes(q||''));
      }
      state.page = 1; render();
    }

    // ===== Events =====
    const debounce=(fn,w=250)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),w); }; };
    document.getElementById('search').addEventListener('input', debounce((e)=>{ state.q=e.target.value; applyFilter(); },200));
    document.getElementById('pageSize').addEventListener('change', (e)=>{ state.pageSize=parseInt(e.target.value,10)||12; state.page=1; render(); });
    document.getElementById('prevBtn').addEventListener('click', ()=>{ if(state.page>1){ state.page--; render(); } });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ state.page++; render(); });

    // ===== Boot =====
    async function boot(){
      try{
        state.all = await fetchBundles();
        state.items = state.all.slice();
        render();
      }catch(e){
        console.error(e);
        document.getElementById('grid').innerHTML = '<p class="text-sm text-rose-400">Erreur de chargement.</p>';
      }
    }
    window.addEventListener('load', boot);
  </script>
</body>
</html>
