<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALTrack — Détail arme</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui; }
    .glass { backdrop-filter: blur(8px); background: rgba(255,255,255,0.06); }
    .level-tile {
      transform: rotate(45deg);
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin:0.2em;
    }
    .level-tile:hover { background: rgba(255,255,255,0.1); border-color: white; }
    .level-number { transform: rotate(-45deg); font-weight: bold; font-size: 1rem; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/80 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-grid place-items-center h-9 w-9 rounded-xl bg-white/10">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
          </svg>
        </span>
        <span class="font-extrabold tracking-tight">VALTrack</span>
      </a>
      <a href="/list_weapon" class="text-sm text-zinc-300 hover:text-white">← Liste</a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    <section class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
      <div>
        <h1 id="weaponName" class="text-3xl sm:text-4xl font-extrabold">Détail arme</h1>
      </div>
      <div class="flex items-center gap-2 text-xs text-zinc-400">
        <span id="ContentTier" style="display: flex" class="px-2 py-1 rounded border border-white/10">Rareté : <b style="display: flex"  id="rarity">—</b></span>
      </div>
    </section>

    <section class="grid gap-6 lg:grid-cols-3">
      <article class="lg:col-span-2 glass rounded-2xl border border-white/10 p-4">
        <div class="aspect-video rounded-xl bg-white/5 overflow-hidden grid place-items-center">
          <img id="mainImage" alt="Preview" class="h-full w-full object-contain hidden"/>
          <video id="mainVideo" class="h-full w-full object-contain hidden" autoplay loop></video>
          <div id="imgSkeleton" class="h-full w-full shimmer"></div>
        </div>
      </article>

      <aside class="glass rounded-2xl border border-white/10 p-4">
        <h2 class="text-lg font-semibold">Options</h2>
        <div class="mt-4">
          <p class="text-sm text-zinc-400 mb-2">Variations</p>
          <div id="variations" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="mt-4">
          <p class="text-sm text-zinc-400 mb-2">Niveaux (animations/sons)</p>
          <div id="levels" class="flex flex-wrap gap-4"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
  const q = sel => document.querySelector(sel);
  const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
  const getParam = name => new URLSearchParams(location.search).get(name);

  function enableMobileFriendlyHover(el, onEnter, onLeave){
    let active = false;
    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    el.addEventListener("click", () => {
      if (!active) { onEnter(); active = true; }
      else { onLeave(); active = false; }
    });
  }

  async function fetchSkin(uuid){
    const url = `https://valorant.lamas.one/valorant/get_skin_information?uuid=${encodeURIComponent(uuid)}`;
    const r = await fetch(url);
    const j = await r.json();
    return j.data;
  }

  async function fetchContentTier(contentTierUUID){
    const url = `https://valorant-api.com/v1/contenttiers/${contentTierUUID}`;
    const r = await fetch(url);
    const j = await r.json();
    return j.data;
  }

  async function fetchChromas(chromasID){
    const url = `https://valorant-api.com/v1/weapons/skinchromas/${chromasID}`;
    const r = await fetch(url);
    const j = await r.json();
    return j.data;
  }

  async function renderMeta(d){
    ContentTier =  await fetchContentTier(d.contentTierUuid)
    q('#weaponName').textContent = d.displayName;
    q('#rarity').innerHTML = ContentTier["displayName"] + "<img style='height:1.5em' src="+ContentTier["displayIcon"]+">";
    q('#ContentTier').style.backgroundColor  = `#${ContentTier["highlightColor"]}`;
  }

  async function renderMain(image){
    q('#mainVideo').classList.add('hidden');
    const imgEl = q('#mainImage');
    q('#imgSkeleton').classList.add('hidden');
    imgEl.src = image;
    imgEl.classList.remove('hidden');
  }

  async function changeImageChromas(image,list){
    uuid = getParam('uuid');
    chromasUUID = image.replace("https://media.valorant-api.com/weaponskinchromas/","").replace("/displayicon.png","")
    try {
        chromasData = await fetchChromas(chromasUUID)
        if(!chromasData["streamedVideo"]){
            const data = await fetchSkin(uuid);
            renderMeta(data);
            renderMain(data.displayIcon);
            renderVariations(data.chromas||[], data.displayIcon);
            renderLevels(data.levels||[], data.displayIcon);
        }else{
          box = q('#levels');
          box.innerHTML = '<a id="video_stream_play" class="glass rounded-2xl border border-white/10 px-4 py-3 text-center font-medium hover:bg-white/15 transition active:scale-95">Lire</a>';
          playbutton = document.getElementById("video_stream_play");
          enableMobileFriendlyHover(playbutton, ()=>{
            if(chromasData.streamedVideo){
              const vid = q('#mainVideo');
              q('#mainImage').classList.add('hidden');
              vid.src = chromasData.streamedVideo;
              vid.classList.remove('hidden');
              vid.play();
            }
          }, ()=>{
            const vid = q('#mainVideo');
            try { vid.pause(); } catch(_) {}
            vid.classList.add('hidden');
            q('#mainImage').classList.remove('hidden');
          });
        }
    } catch (error) {
      const data = await fetchSkin(uuid);
      renderMeta(data);
      renderMain(data.displayIcon);
      renderVariations(data.chromas||[], data.displayIcon);
      renderLevels(data.levels||[], data.displayIcon);
    }
    renderMain(image)
  }

  function renderVariations(list, baseImage){
    const box = q('#variations'); box.innerHTML = '';
    if(list.length <= 1){
      box.innerHTML = 'Aucune Variation';
    }else{ 
      list.forEach((c, idx)=>{
        const b = el('button','h-9 w-9 rounded border border-white/10 overflow-hidden');
        b.style.background = `url('${c.swatch || c.displayIcon || baseImage}') center/cover`;
        b.onclick = ()=> changeImageChromas(c.displayIcon || baseImage, list);
        box.appendChild(b);
      });
    }
  }

  function renderLevels(list, baseImage){
    const box = q('#levels'); box.innerHTML = '';
    if(list.length <= 1){
      box.innerHTML = 'Aucun niveau';
    }else{ 
      list.forEach((l, idx)=>{
        const tile = el('div','level-tile');
        tile.innerHTML = `<span class="level-number">${idx+1}</span>`;
        enableMobileFriendlyHover(tile, ()=>{
          if(l.streamedVideo){
            const vid = q('#mainVideo');
            q('#mainImage').classList.add('hidden');
            vid.src = l.streamedVideo;
            vid.classList.remove('hidden');
            vid.play();
          }
        }, ()=>{
          const vid = q('#mainVideo');
          try { vid.pause(); } catch(_) {}
          vid.classList.add('hidden');
          q('#mainImage').classList.remove('hidden');
        });
        box.appendChild(tile);
      });
    }
  }

  async function boot(){
    const uuid = getParam('uuid');
    if(!uuid) return;
    const data = await fetchSkin(uuid);
    renderMeta(data);
    renderMain(data.displayIcon);
    renderVariations(data.chromas||[], data.displayIcon);
    renderLevels(data.levels||[], data.displayIcon);
  }

  window.addEventListener('load', boot);
  </script>
</body>
</html>
