<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALTrack — Recherche armes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui; }
    .glass { backdrop-filter: blur(8px); background: rgba(255,255,255,0.06); }
    .shimmer{ position:relative; overflow:hidden; }
    .shimmer::after{ content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); animation:shimmer 1.3s infinite; }
    @keyframes shimmer{100%{transform:translateX(100%);}}
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/80 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-grid place-items-center h-9 w-9 rounded-xl bg-white/10">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
          </svg>
        </span>
        <span class="font-extrabold tracking-tight">VALTrack</span>
      </a>
      <a href="/" class="text-sm text-zinc-300 hover:text-white">← Accueil</a>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    <!-- Search bar -->
    <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
      <h1 class="text-2xl font-bold">Armes</h1>
      <div class="flex items-center gap-2">
        <input id="search" type="text" placeholder="Rechercher une arme…" class="w-72 max-w-full rounded-xl bg-zinc-900/70 border border-white/10 px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-400"/>
        <select id="pageSize" class="rounded-xl bg-zinc-900/70 border border-white/10 px-3 py-2 text-sm">
          <option value="8">8 / page</option>
          <option value="12" selected>12 / page</option>
          <option value="16">16 / page</option>
          <option value="24">24 / page</option>
        </select>
      </div>
    </section>

    <!-- Grid -->
    <section>
      <div id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- cards -->
      </div>

      <!-- Pagination -->
      <div class="mt-8 flex items-center justify-between">
        <p class="text-sm text-zinc-400">Page <span id="curPage">1</span> / <span id="maxPage">1</span> — <span id="total">0</span> résultats</p>
        <div class="flex items-center gap-2">
          <button id="prevBtn" class="px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5 disabled:opacity-40" disabled>Précédent</button>
          <button id="nextBtn" class="px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5 disabled:opacity-40" disabled>Suivant</button>
        </div>
      </div>
    </section>
  </main>

  <template id="cardTpl">
    <article class="rounded-2xl border border-white/10 glass overflow-hidden flex flex-col">
      <div class="relative">
        <div class="aspect-[4/3] bg-white/5 grid place-items-center overflow-hidden">
          <img class="weapon-img h-full w-full object-contain hidden" alt="Arme"/>
          <div class="skeleton h-full w-full shimmer"></div>
        </div>
        <!-- barre basse colorée -->
        <div class="bar h-1.5 w-full"></div>
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <h3 class="name font-semibold">Weapon</h3>
        <p class="cat text-xs text-zinc-400 mt-0.5">—</p>
        <div class="mt-4">
          <button class="detail inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-white/10 text-sm hover:bg-white/5">Détails</button>
        </div>
      </div>
    </article>
  </template>

<script>
  // Liste & recherche de SKINS (flatten depuis /v1/weapons)
  const state = { all: [], items: [], page: 1, pageSize: 12, q: '' };

  const CAT_COLORS = { 'Sidearm':'#60a5fa','SMG':'#34d399','Shotgun':'#fbbf24','Rifle':'#a78bfa','Sniper':'#f472b6','Heavy':'#fb7185','Melee':'#94a3b8' };
  const TIER_COLORS = {
    '0cebb8be-46d7-c12a-d306-e9907bfc5a25':'#00958733',
    'e046854e-406c-37f4-6607-19a9ba8426fc':'#f5955b33',
    '60bca009-4182-7998-dee7-b8a2558dc369':'#d1548d33',
    '12683d76-48d7-84a3-4e09-6985794f0445':'#5a9fe233',
    '411e4a55-4e59-7757-41f0-86a53f101bb5':'#fad66333'  };

  const normalizeName = s => (s||'').toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
  const paginate = (arr,p,ps)=>{ const i=(p-1)*ps; return arr.slice(i,i+ps); };
  const colorForSkin = s => (s.contentTierUuid && TIER_COLORS[s.contentTierUuid])

  async function fetchSkins(){
    const key='vt_skins_all_v1'; const now=Date.now();
    try{
      const raw=localStorage.getItem(key);
      if(raw){ const o=JSON.parse(raw); if(now-(o.ts||0)<86400000) return o.data; }
    }catch(_){}
    const r=await fetch('https://valorant-api.com/v1/weapons');
    if(!r.ok) throw new Error('weapons fetch failed');
    const {data=[]}=await r.json();

    const out=[];
    for(const w of data){
      const weaponName=w.displayName;
      const weaponCategory=w.shopData?.categoryText||w.category||'—';
      for(const s of (w.skins||[])){
        if(s.isNullOrPlaceholder) continue;
        const displayIcon=s.displayIcon||(s.chromas&&s.chromas[0]?.fullRender)||'';
        out.push({
          uuid:s.uuid,
          displayName:s.displayName,
          displayIcon,
          contentTierUuid:s.contentTierUuid||w.contentTierUuid||null,
          weaponName,
          weaponCategory
        });
      }
    }
    try{ localStorage.setItem(key, JSON.stringify({ts:now, data:out})); }catch(_){}
    return out;
  }

  function render(){
    const grid=document.getElementById('grid'),
          cur=document.getElementById('curPage'),
          max=document.getElementById('maxPage'),
          total=document.getElementById('total'),
          prev=document.getElementById('prevBtn'),
          next=document.getElementById('nextBtn');

    const pages=Math.max(1, Math.ceil(state.items.length/state.pageSize));
    if(state.page>pages) state.page=pages;
    const pageItems=paginate(state.items,state.page,state.pageSize);

    grid.innerHTML='';
    const tpl=document.getElementById('cardTpl');
    pageItems.forEach(s=>{
      const node=tpl.content.cloneNode(true);
      const img=node.querySelector('.weapon-img');
      const skel=node.querySelector('.skeleton');
      const name=node.querySelector('.name');
      const cat=node.querySelector('.cat');
      const bar=node.querySelector('.bar');
      const btn=node.querySelector('.detail');

      if(s.displayIcon){ img.src=s.displayIcon; img.classList.remove('hidden'); skel.classList.add('hidden'); }
      name.textContent=s.displayName||'Skin';
      cat.textContent=`${s.weaponName} — ${s.weaponCategory}`;
      bar.style.background=colorForSkin(s);

      btn.onclick=()=>{ window.location.href=`/weapon?uuid=${encodeURIComponent(s.uuid)}`; };
      grid.appendChild(node);
    });

    cur.textContent=String(state.page);
    max.textContent=String(pages);
    total.textContent=String(state.items.length);
    prev.disabled=state.page<=1;
    next.disabled=state.page>=pages;
  }

  function applyFilter(){
    const q=normalizeName(state.q);
    state.items = !q ? state.all.slice()
                     : state.all.filter(s => normalizeName(s.displayName).includes(q) || normalizeName(s.weaponName).includes(q));
    state.page=1; render();
  }

  const debounce=(fn,w=250)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),w); }; };
  document.getElementById('search').addEventListener('input', debounce(e=>{ state.q=e.target.value; applyFilter(); },200));
  document.getElementById('pageSize').addEventListener('change', e=>{ state.pageSize=parseInt(e.target.value,10)||12; state.page=1; render(); });
  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(state.page>1){ state.page--; render(); } });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ state.page++; render(); });

  async function boot(){
    try{ state.all=await fetchSkins(); state.items=state.all.slice(); render(); }
    catch(e){ console.error(e); document.getElementById('grid').innerHTML='<p class="text-sm text-rose-400">Erreur de chargement.</p>'; }
  }
  window.addEventListener('load', boot);
</script>

</body>
</html>
