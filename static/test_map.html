/* ---- Sync canvas à la taille affichée ---- */
function syncCanvasToCSS(){
  cv.width = wrap.clientWidth;
  cv.height = wrap.clientHeight;
}

/* ---- Ancres ---- */
function initAnchors(){
  const box=$("anchors"); box.innerHTML="";
  anchorDefs[mapID].forEach((a,i)=>{
    const row=document.createElement("div");
    row.innerHTML=`<label><input type="checkbox" checked data-i="${i}"> ${a.label}</label>`;
    box.appendChild(row);

    const p=document.createElement("div");
    p.className="pin"; p.style.left="50%"; p.style.top="50%"; p.dataset.i=i;
    const lbl=document.createElement("div"); lbl.textContent=a.label; p.appendChild(lbl);
    wrap.appendChild(p); enableDrag(p); pins.push(p);
  });
}
function enableDrag(el){
  let dragging=false;
  el.addEventListener("pointerdown",e=>{dragging=true;el.setPointerCapture(e.pointerId);});
  el.addEventListener("pointermove",e=>{
    if(!dragging) return;
    const r=wrap.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;   // px CSS
    // contraindre aux bords
    el.style.left=Math.max(0,Math.min(r.width ,x))+"px";
    el.style.top =Math.max(0,Math.min(r.height,y))+"px";
  });
  el.addEventListener("pointerup",()=>dragging=false);
}


/* ---- Calibration ---- */
$("clear").onclick=()=>{ T=null; calW=null; calH=null; draw(); $("rms").textContent="–"; };

$("solve").onclick=()=>{
  const P=[];
  pins.forEach((p,i)=>{
    const cb=document.querySelector('input[data-i="'+i+'"]');
    if(cb && cb.checked){
      const px=parseFloat(p.style.left); // px CSS
      const py=parseFloat(p.style.top);  // px CSS
      P.push({wx:anchorDefs[i].x, wy:anchorDefs[i].y, X:px, Y:py});
    }
  });
  if(P.length<3){ alert("Au moins 3 ancres."); return; }
  T = solveAffineLS(P);            // T en px CSS (taille actuelle)
  calW = wrap.clientWidth;         // on mémorise la taille actuelle
  calH = wrap.clientHeight;
  $("rms").textContent=rmsError(P,T).toFixed(2);
  draw();
};

/* ---- Save / Load ---- */
$("saveCalib").onclick=()=>{
  if(!T){alert("Pas encore calibré !");return;}
  localStorage.setItem("ascentCalib", JSON.stringify({matrix:T, w:calW, h:calH}));
  alert("Calibration sauvegardée !");
};
$("loadCalib").onclick=()=>{
  const s=localStorage.getItem("ascentCalib");
  if(!s){alert("Rien de sauvegardé");return;}
  const data=JSON.parse(s);
  const K=data.matrix; const w0=data.w||wrap.clientWidth, h0=data.h||wrap.clientHeight;
  const sx=wrap.clientWidth / w0, sy=wrap.clientHeight / h0;
  // on adapte la matrice à la nouvelle taille CSS (post-scale)
  T=[ K[0]*sx, K[1]*sx, K[2]*sx,  K[3]*sy, K[4]*sy, K[5]*sy ];
  calW=wrap.clientWidth; calH=wrap.clientHeight;
  alert("Calibration rechargée !");
  draw();
};

/* ---- Math ---- */
function worldToImg(wx,wy,t){ return {X:t[0]*wx+t[1]*wy+t[2], Y:t[3]*wx+t[4]*wy+t[5]}; }
function rmsError(P,t){let s=0;P.forEach(p=>{const q=worldToImg(p.wx,p.wy,t);s+=(q.X-p.X)**2+(q.Y-p.Y)**2});return Math.sqrt(s/P.length);}
function solveAffineLS(P){
  const N=P.length,m=2*N,n=6;
  const A=Array.from({length:m},()=>Array(n).fill(0)),b=Array(m).fill(0);
  P.forEach((p,i)=>{A[2*i]=[p.wx,p.wy,1,0,0,0];b[2*i]=p.X;A[2*i+1]=[0,0,0,p.wx,p.wy,1];b[2*i+1]=p.Y;});
  const AtA=matMul(matTrans(A),A),Atb=matVec(matTrans(A),b);
  return gaussSolve(AtA,Atb);
}
function matTrans(M){const r=M.length,c=M[0].length;const T=Array.from({length:c},()=>Array(r));
  for(let i=0;i<r;i++)for(let j=0;j<c;j++)T[j][i]=M[i][j];return T;}
function matMul(A,B){const r=A.length,c=B[0].length,k=A[0].length;const R=Array.from({length:r},()=>Array(c).fill(0));
  for(let i=0;i<r;i++)for(let j=0;j<c;j++){let s=0;for(let t=0;t<k;t++)s+=A[i][t]*B[t][j];R[i][j]=s;}return R;}
function matVec(A,v){const r=A.length,c=A[0].length;const out=Array(r).fill(0);
  for(let i=0;i<r;i++){let s=0;for(let j=0;j<c;j++)s+=A[i][j]*v[j];out[i]=s;}return out;}
function gaussSolve(A,b){const n=b.length;const M=A.map(r=>r.slice());const x=b.slice();
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;
    [M[i],M[p]]=[M[p],M[i]];[x[i],x[p]]=[x[p],x[i]];const diag=M[i][i]||1e-12;
    for(let j=i;j<n;j++)M[i][j]/=diag;x[i]/=diag;
    for(let r=0;r<n;r++)if(r!==i){const f=M[r][i];for(let j=i;j<n;j++)M[r][j]-=f*M[i][j];x[r]-=f*x[i];}}
  return x;
}
